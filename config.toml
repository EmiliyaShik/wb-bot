# Цены, периоды, пороги и расписание. Секретов и реквизитов здесь нет:
# они живут только в переменных окружения (см. .env.example).

# Модуль это не одна функция: за одну цену селлер получает несколько разных
# отчётов, и одной фразой их пользу не назвать - три вещи внутри одного
# предложения читаются как одна. Поэтому отчёты записаны списком, у каждого
# своё имя, своя команда и своя польза; gives остаётся общей строкой про
# модуль. Модулю с единственным отчётом список ничего не добавляет, поэтому
# витрина его не печатает, а экран отчётов собирает кнопки по нему же.

[modules.finance]
price_month = 990
agents = ["finance", "watchdog", "profit"]
visible = true
title = "Финансы"
gives = "Три отчёта о деньгах кабинета: куда ушла выручка недели, какой расход вырос против обычного и сколько заработал каждый товар."
diagnostic_line = "Такие утечки бот будет находить каждую неделю и раскладывать по артикулам, чтобы было видно, какой товар их создаёт."

[[modules.finance.reports]]
command = "finance"
title = "Деньги за неделю"
gives = "Сколько Wildberries забрал за неделю и за что: комиссия, логистика, хранение, приёмка, штрафы, реклама. Видно, из чего сложилась сумма, которая пришла на счёт."

[[modules.finance.reports]]
command = "dynamics"
title = "Что выросло"
gives = "Видно, какой расход вырос против обычного и во что этот рост обошёлся в рублях. Раз в неделю бот говорит об этом сам, ждать вопроса не нужно."

[[modules.finance.reports]]
command = "profit"
title = "Прибыль по артикулам"
gives = "Сколько осталось после всех удержаний по каждому товару: какой кормит, а какой продаётся в минус."

[modules.rnp]
price_month = 590
agents = ["rnp"]
visible = true
title = "План-факт"
gives = "Помогает держать план на месяц: каждое утро присылает, сколько уже продано и сколько осталось до цели, считает, успеваете ли вы по нынешнему темпу, и заранее говорит, какой товар скоро закончится."
diagnostic_line = "Скажет, успеваете ли вы к плану месяца, и назовёт товары, которых хватит меньше чем на 14 дней."

[[modules.rnp.reports]]
command = "rnp"
title = "План-факт"
gives = "Сколько продано с начала месяца, сколько осталось до цели и успеваете ли вы по нынешнему темпу."

[modules.ads]
price_month = 1290
# minus_clusters (агент 6, минус-фразы) сознательно не построен: он
# единственный писал бы в кабинет клиента, а сейчас методов записи в
# проекте нет ни одного, и это проверяется тестом. Перечислять его тут
# значило бы обещать то, чего нет.
agents = ["ads_report"]
visible = true
title = "Реклама"
gives = "Разбирает рекламные кампании: сколько стоит один заказ, какие кампании укладываются в вашу цель по ДРР, а какие тратят бюджет впустую."
diagnostic_line = "По рекламе бот посчитает цену заказа и ДРР каждой кампании и сравнит их с вашей целью."

[[modules.ads.reports]]
command = "ads"
title = "Реклама"
gives = "Расход, заказы, цена заказа и ДРР по каждой кампании и по дням, рядом с вашей целью по ДРР."

[modules.funnel]
price_month = 490
agents = ["funnel"]
visible = true
title = "Воронка"
gives = "Показывает путь покупателя по карточке: сколько человек в неё зашло, сколько положило товар в корзину, сколько заказало и сколько выкупило. Сравнивает с прошлым периодом и называет шаг, на котором покупатели стали теряться чаще."
diagnostic_line = "По воронке бот покажет, на каком шаге пути к покупке люди стали теряться чаще, чем раньше, и по каким товарам это заметнее всего."

[[modules.funnel.reports]]
command = "funnel"
title = "Воронка"
gives = "Путь покупателя по каждому товару: заход в карточку, корзина, заказ, выкуп. Видно, на каком шаге конверсия просела против прошлого периода."

[modules.all]
price_month = 2490
agents = []
includes = "*"           # все видимые модули
# Открыты все четыре модуля: 990 + 590 + 1290 + 490 это 3360 по отдельности.
# Пакет за 2490 дешевле на 870, то есть на 26 процентов. Цену выбрал владелец:
# пакет должен быть выгоднее, чем брать всё порознь, но не настолько, чтобы
# тот, кому нужен один модуль, считал себя переплачивающим за отказ.
visible = true
title = "Всё сразу"
gives = "Все открытые модули сразу, одной подпиской и дешевле, чем по отдельности."
diagnostic_line = "Соберёт всё вместе: недельную раскладку расходов, прибыль по артикулам, план-факт, рекламу и воронку по вашему кабинету."

[periods]                # скидка в процентах
months_1 = 0
months_3 = 10
months_12 = 20

[trial]
days = 7
modules = 1              # один модуль на выбор

[access]
grace_days = 3
renewal_notice_days = 5
retention_days = 30
retention_notice_days = 3

[storage]
# Сколько суток хранить суточную историю кабинета: рекламу (ad_daily,
# ad_nm_daily, ad_upd) и воронку с остатками (nm_daily). Данные копятся у
# каждого подключённого кабинета каждый день и независимо от подписки,
# поэтому без срока таблицы растут бесконечно: кабинет на 200 артикулов
# набирает за год порядка 70 тысяч строк воронки и больше того по рекламе.
# Это не то же самое, что [access] retention_days: там сказано, сколько
# данные ушедшего клиента лежат до удаления, а тут сколько глубины истории
# нужно работающему кабинету. Глубина считается по самому длинному отчёту:
# у воронки это квартал плюс квартал для сравнения, то есть 180 суток, у
# рекламы квартал. Год с запасом взят затем, чтобы сравнение с прошлым годом
# можно было открыть, не переписывая код. Ноль и меньше выключают чистку.
daily_history_days = 400

[alerts]                 # пороги сторожа скрытых расходов, в п.п.
acquiring = 0.5
commission = 2.0
spp = -5.0
logistics_share = 2.0
storage_share = 2.0
baseline_weeks = 4

[cards]
# Сколько дней хранимое название карточки считается свежим. Названия лежат у
# нас, потому что в отчёте о реализации их нет вовсе, а тянуть весь каталог
# на каждый отчёт незачем. Семь дней: переименование карточки доедет до
# отчёта за неделю, а в Wildberries за каталогом бот сходит не чаще раза в
# неделю на кабинет, то есть лимит метода карточек (100 запросов в минуту)
# не задевается даже близко. Ноль выключает обновление совсем: тогда
# название спрашивается один раз и остаётся навсегда.
name_ttl_days = 7

[ads]
# Целевой ДРР по умолчанию, в процентах. Это именно значение по умолчанию:
# свою цель селлер ставит сам в /settings, и она ложится в его настройки.
# Пятнадцать процентов взяты из задания владельца как обычная граница, за
# которой реклама перестаёт окупаться у большинства товаров.
target_drr = 15
# Сколько дней рекламы забирать за один заход суточного сбора. Wildberries
# отдаёт статистику только по кампаниям в статусах 7, 9 и 11: удалённая
# кампания уносит историю с собой, поэтому расход копится у нас. Неделя,
# как и у воронки: окно само закрывает дыры, если бот сутки не работал, а
# метод берёт максимум 31 день за запрос при лимите 3 запроса в минуту.
collect_days = 7
# Границы вывода про две цифры ДРР, в процентах от выручки товара.
# Выше первой: почти вся выручка товара пришла с рекламы, сам он почти не
# продаётся. Ниже второй: реклама добавляет немного, основное товар делает
# сам. Между ними бот вывода не делает, а просто показывает обе цифры.
ad_driven_share = 70
self_selling_share = 30

[funnel]
# Сколько артикулов кабинета забирать суточной воронкой за один заход.
# Метод Wildberries берёт максимум 20 артикулов за запрос при лимите
# 3 запроса в минуту, то есть 20 секунд на каждую пачку: 200 артикулов это
# 10 запросов и около трёх с половиной минут на кабинет в сутки, 500 уже
# около восьми минут, а сбор идёт у каждого подключённого кабинета.
# Двести взяты как предел, за которым ночной сбор перестаёт помещаться в
# ночь при десятках кабинетов. Артикулы отбираются не подряд: сначала идут
# те, что продаются (по выручке за то же окно), потому что история нужна
# прежде всего по товару, который приносит деньги.
# Ноль и меньше значат «без предела»: собирать все артикулы кабинета.
daily_articles = 200
# Пороги просадки, в процентных пунктах. Конверсию Wildberries отдаёт целыми
# процентами, поэтому меньше одного пункта разглядеть нечем, а один пункт у
# этих трёх шагов значит разное. Заход в корзину живёт около десяти процентов,
# и два пункта там это пятая часть шага. Корзина в заказ и заказ в выкуп
# живут ближе к половине, и там два пункта это обычные колебания недели.
drop_to_cart = 2.0
drop_to_order = 3.0
drop_to_buyout = 3.0
# Порог для пятого этапа: видимость в поиске. Единица тут другая, и намеренно.
# Сама видимость это процент вероятности, что покупатель увидит карточку, а
# Wildberries отдаёт к ней готовую динамику против прошлого периода, тоже в
# процентах. Значит, порог это относительное падение: «видимость упала больше
# чем на пятнадцать процентов». Этап есть только у кабинетов с подпиской Джем,
# у остальных воронка живёт четырьмя шагами.
drop_visibility = 15.0
# Сколько заказов за период должно быть у товара, чтобы бот вообще сравнивал
# его конверсии. На двух заказах один отказ покупателя уводит выкуп с ста
# процентов до пятидесяти, и это не просадка, а арифметика малых чисел.
min_orders = 5
# Какая доля дней периода должна быть собрана, чтобы сравнение имело смысл.
# История по дням копится у нас (Wildberries отдаёт её только за последнюю
# неделю), и у товара, который не попал в daily_articles, в ней будут дыры.
# Товар с дырами показывается, но в поиск просадки не идёт: меньше собранных
# дней это меньше заходов и заказов, а не упавшая конверсия.
coverage = 0.7

[schedule]
timezone = "Europe/Moscow"
daily_at = "09:00"
# Как часто бот заглядывает к Wildberries: не готов ли новый недельный отчёт.
# Раз в 6 часов значит четыре захода в сутки, отчёт находится в тот же день,
# когда появился, и кабинет при этом не дёргается лишний раз.
weekly_check_hours = 6

[invoice]
valid_bank_days = 5
vat_note = ""            # заполнить: налоговый режим ИП
holidays = []            # нерабочие дни сверх выходных, ГГГГ-ММ-ДД
service_name = "Предоставление доступа к онлайн-сервису WBРентген, модуль {module}, период {period}"

[queue]                  # повторы фоновых задач
attempts = 3             # сколько раз пробовать, прежде чем сдаться
retry_base_sec = 60      # первая пауза перед повтором
retry_factor = 3         # во сколько раз растёт пауза с каждой попыткой
retry_max_sec = 3600     # дальше этой паузы не растём
# Пауза между сообщениями о сорвавшихся работах одному получателю. Десять
# подряд упавших задач дают одно сообщение, остальные остаются в журнале:
# десять писем подряд это не забота, а наказание. Ноль выключает паузу.
notice_gap_sec = 900

[limits]
client_messages_per_minute = 20   # вежливый отказ при превышении
# Самый большой файл, который клиент может прислать боту, в мегабайтах.
# Шаблон себестоимости обычно занимает меньше одного, пять взяты с запасом.
upload_max_mb = 5
wb_requests_per_domain = 3        # лимит WB: 3 запроса
wb_requests_window_sec = 30       # за 30 секунд на домен
# Сколько раз один клиент за сутки отправит бота в справочник DaData за
# реквизитами по ИНН. Квота ключа общая на весь сервис, поэтому предел стоит
# на каждого: иначе один человек выжег бы её всем. Живому селлеру хватает
# двух-трёх обращений на счёт, двадцать взяты с большим запасом. Упёршийся в
# предел не остаётся без счёта: наименование и адрес он вводит руками.
dadata_lookups_per_client_per_day = 20

# Категория токена WB -> что перестанет работать, если её не выдали.
# Читает хендлер подключения кабинета, когда разбирает маску токена.
# breaks - модули, которые без этой категории не заработают совсем;
# note - что сказать селлеру своими словами.

[token_categories.statistics]
title = "Статистика"
breaks = []
breaks_diagnostic = false
note = "Сейчас эта категория ни для чего не используется, она запрошена на будущее."

[token_categories.finance]
title = "Финансы"
breaks = ["finance"]
breaks_diagnostic = true
note = "Не заработает модуль finance и бесплатная диагностика."

[token_categories.promotion]
title = "Продвижение"
breaks = ["ads"]
breaks_diagnostic = false
note = "Не заработает модуль ads: это разбор рекламных кампаний. Заодно пропадёт расход рекламы в /profit и ДРР в плане-факте."

[token_categories.analytics]
title = "Аналитика"
breaks = ["rnp", "funnel"]
breaks_diagnostic = false
note = "Не заработает модуль rnp, это план-факт по дням, и модуль funnel: воронку по дням бот берёт оттуда же."

[token_categories.content]
title = "Контент"
breaks = []
breaks_diagnostic = false
note = "Не собрать шаблон себестоимости по вашим артикулам."
