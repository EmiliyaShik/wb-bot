# Цены, периоды, пороги и расписание. Секретов и реквизитов здесь нет:
# они живут только в переменных окружения (см. .env.example).

# Модуль это не одна функция: за одну цену селлер получает несколько разных
# отчётов, и одной фразой их пользу не назвать - три вещи внутри одного
# предложения читаются как одна. Поэтому отчёты записаны списком, у каждого
# своё имя, своя команда и своя польза; gives остаётся общей строкой про
# модуль. Модулю с единственным отчётом список ничего не добавляет, поэтому
# витрина его не печатает, а экран отчётов собирает кнопки по нему же.

[modules.finance]
price_month = 990
agents = ["finance", "watchdog", "profit"]
visible = true
title = "Финансы"
gives = "Три отчёта о деньгах кабинета: куда ушла выручка недели, какой расход вырос против обычного и сколько заработал каждый товар."
diagnostic_line = "Такие утечки бот будет находить каждую неделю и раскладывать по артикулам, чтобы было видно, какой товар их создаёт."

[[modules.finance.reports]]
command = "finance"
title = "Деньги за неделю"
gives = "Сколько Wildberries забрал за неделю и за что: комиссия, логистика, хранение, приёмка, штрафы, реклама. Видно, из чего сложилась сумма, которая пришла на счёт."

[[modules.finance.reports]]
command = "dynamics"
title = "Что выросло"
gives = "Видно, какой расход вырос против обычного и во что этот рост обошёлся в рублях. Раз в неделю бот говорит об этом сам, ждать вопроса не нужно."

[[modules.finance.reports]]
command = "profit"
title = "Прибыль по артикулам"
gives = "Сколько осталось после всех удержаний по каждому товару: какой кормит, а какой продаётся в минус."

[modules.rnp]
price_month = 590
agents = ["rnp"]
visible = true
title = "План-факт"
gives = "Помогает держать план на месяц: каждое утро присылает, сколько уже продано и сколько осталось до цели, считает, успеваете ли вы по нынешнему темпу, и заранее говорит, какой товар скоро закончится."
diagnostic_line = "Скажет, успеваете ли вы к плану месяца, и назовёт товары, которых хватит меньше чем на 14 дней."

[[modules.rnp.reports]]
command = "rnp"
title = "План-факт"
gives = "Сколько продано с начала месяца, сколько осталось до цели и успеваете ли вы по нынешнему темпу."

[modules.ads]
price_month = 1290
agents = ["ads_report", "minus_clusters"]
visible = false          # откроется на этапе 3
title = "Реклама"
gives = "Разбирает рекламные кампании: куда уходит бюджет и какие запросы тратят его впустую. Откроется позже."
diagnostic_line = ""     # скрытые модули диагностика не показывает

[modules.funnel]
price_month = 490
agents = ["funnel"]
visible = false          # откроется на этапе 3
title = "Воронка"
gives = "Показывает путь покупателя по карточке: сколько человек её увидело, сколько положило товар в корзину и сколько довело до заказа. Откроется позже."
diagnostic_line = ""     # скрытые модули диагностика не показывает

[modules.all]
price_month = 2290
agents = []
includes = "*"           # все видимые модули
# Вернётся на этапе 3, вместе с ads и funnel: пока открыты два модуля из
# четырёх, пакет за 2290 дороже, чем эти два по отдельности (990 + 590).
visible = false
title = "Всё сразу"
gives = "Все открытые модули сразу, одной подпиской и дешевле, чем по отдельности."
diagnostic_line = ""     # скрытые модули диагностика не показывает

[periods]                # скидка в процентах
months_1 = 0
months_3 = 10
months_12 = 20

[trial]
days = 7
modules = 1              # один модуль на выбор

[access]
grace_days = 3
renewal_notice_days = 5
retention_days = 30
retention_notice_days = 3

[alerts]                 # пороги сторожа скрытых расходов, в п.п.
acquiring = 0.5
commission = 2.0
spp = -5.0
logistics_share = 2.0
storage_share = 2.0
baseline_weeks = 4

[cards]
# Сколько дней хранимое название карточки считается свежим. Названия лежат у
# нас, потому что в отчёте о реализации их нет вовсе, а тянуть весь каталог
# на каждый отчёт незачем. Семь дней: переименование карточки доедет до
# отчёта за неделю, а в Wildberries за каталогом бот сходит не чаще раза в
# неделю на кабинет, то есть лимит метода карточек (100 запросов в минуту)
# не задевается даже близко. Ноль выключает обновление совсем: тогда
# название спрашивается один раз и остаётся навсегда.
name_ttl_days = 7

[schedule]
timezone = "Europe/Moscow"
daily_at = "09:00"
# Как часто бот заглядывает к Wildberries: не готов ли новый недельный отчёт.
# Раз в 6 часов значит четыре захода в сутки, отчёт находится в тот же день,
# когда появился, и кабинет при этом не дёргается лишний раз.
weekly_check_hours = 6

[invoice]
valid_bank_days = 5
vat_note = ""            # заполнить: налоговый режим ИП
holidays = []            # нерабочие дни сверх выходных, ГГГГ-ММ-ДД
service_name = "Предоставление доступа к онлайн-сервису WBРентген, модуль {module}, период {period}"

[queue]                  # повторы фоновых задач
attempts = 3             # сколько раз пробовать, прежде чем сдаться
retry_base_sec = 60      # первая пауза перед повтором
retry_factor = 3         # во сколько раз растёт пауза с каждой попыткой
retry_max_sec = 3600     # дальше этой паузы не растём

[limits]
client_messages_per_minute = 20   # вежливый отказ при превышении
# Самый большой файл, который клиент может прислать боту, в мегабайтах.
# Шаблон себестоимости обычно занимает меньше одного, пять взяты с запасом.
upload_max_mb = 5
wb_requests_per_domain = 3        # лимит WB: 3 запроса
wb_requests_window_sec = 30       # за 30 секунд на домен
# Сколько раз один клиент за сутки отправит бота в справочник DaData за
# реквизитами по ИНН. Квота ключа общая на весь сервис, поэтому предел стоит
# на каждого: иначе один человек выжег бы её всем. Живому селлеру хватает
# двух-трёх обращений на счёт, двадцать взяты с большим запасом. Упёршийся в
# предел не остаётся без счёта: наименование и адрес он вводит руками.
dadata_lookups_per_client_per_day = 20

# Категория токена WB -> что перестанет работать, если её не выдали.
# Читает хендлер подключения кабинета, когда разбирает маску токена.
# breaks - модули, которые без этой категории не заработают совсем;
# note - что сказать селлеру своими словами.

[token_categories.statistics]
title = "Статистика"
breaks = []
breaks_diagnostic = false
note = "Сейчас эта категория ни для чего не используется, она запрошена на будущее."

[token_categories.finance]
title = "Финансы"
breaks = ["finance"]
breaks_diagnostic = true
note = "Не заработает модуль finance и бесплатная диагностика."

[token_categories.promotion]
title = "Продвижение"
breaks = []
breaks_diagnostic = false
note = "Не будет расхода рекламы в /profit и ДРР в плане-факте. Остальное работает."

[token_categories.analytics]
title = "Аналитика"
breaks = ["rnp"]
breaks_diagnostic = false
note = "Не заработает модуль rnp, это план-факт по дням."

[token_categories.content]
title = "Контент"
breaks = []
breaks_diagnostic = false
note = "Не собрать шаблон себестоимости по вашим артикулам."
